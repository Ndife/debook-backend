version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: debook_postgres
    restart: always
    environment:
      POSTGRES_USER: debook_user
      POSTGRES_PASSWORD: debook_password
      POSTGRES_DB: debook_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: debook_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: