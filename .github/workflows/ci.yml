name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/*]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint (Check for formatting & "no-any")
        run: npm run lint

      - name: Build (Check for compilation errors)
        run: npm run build

      - name: Unit Tests
        run: npm run test

      - name: E2E Tests
        run: npm run test:e2e
